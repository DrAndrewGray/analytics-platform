# Safe to commit: credentials come from environment variables, not literals.
# Run dbt with `--profiles-dir dbt` (or set DBT_PROFILES_DIR=dbt) from the repo root.
meridian_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'meridian') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'meridian') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'meridian') }}"
      schema: analytics
      threads: 4
    ci:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'meridian') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'meridian') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'meridian') }}"
      schema: analytics_ci
      threads: 4
