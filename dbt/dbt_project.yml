name: "meridian_analytics"
version: "1.0.0"
config-version: 2

profile: "meridian_analytics"

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  meridian_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts
      billing:
        +materialized: table
        +schema: marts
      events:
        +materialized: table
        +schema: marts
      finance:
        +materialized: table
        +schema: marts

seeds:
  meridian_analytics:
    +schema: seeds
