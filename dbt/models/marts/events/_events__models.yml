version: 2

models:
  - name: fct_events
    description: One row per event, deduplicated, identity-resolved, sessionized.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null

  - name: fct_sessions
    description: One row per session.
    columns:
      - name: session_id
        tests:
          - unique
          - not_null
      - name: event_count
        tests:
          - not_negative

  - name: mart_funnel_conversion
    description: One row per day — funnel-step visitor counts and conversion rates.
    columns:
      - name: activity_date
        tests:
          - unique
          - not_null

  - name: mart_activation
    description: One row per customer who has ever signed up.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
