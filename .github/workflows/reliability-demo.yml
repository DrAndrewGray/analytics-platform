name: Reliability demo

# Manually-triggered, not run on every push (see ci.yml for that): this
# workflow deliberately breaks a clean database and asserts that the
# expected control actually catches it. It's a demonstration of Phase 5's
# controls, not a gate other work should have to pass — see
# docs/reliability_strategy.md.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Failure scenario to inject (see scripts/inject_failure.py list)
        required: true
        type: choice
        options:
          - drop-column
          - change-column-type
          - bad-status
          - duplicate-pk
          - broken-fk
          - volume-drop
          - revenue-spike
          - source-stale
          - late-arriving-refund

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: meridian
  POSTGRES_USER: meridian
  POSTGRES_PASSWORD: meridian

jobs:
  demo:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Generate synthetic data (retail, billing, events)
        run: |
          uv run python scripts/generate_synthetic_data.py
          uv run python scripts/generate_billing_data.py
          uv run python scripts/generate_event_data.py

      - name: Ingest into raw schemas
        run: |
          uv run python scripts/ingest.py
          uv run python scripts/ingest_billing.py
          uv run python scripts/ingest_events.py

      - name: Install dbt packages
        working-directory: dbt
        run: uv run dbt deps --profiles-dir .

      - name: Baseline dbt build (must be clean before injecting anything)
        working-directory: dbt
        run: uv run dbt build --profiles-dir . --target ci

      # Needed to verify late-arriving-refund actually adds a NEW late
      # adjustment, not just "the build stayed green" (which a bug in
      # fetch_late_adjustments() itself could satisfy without doing
      # anything) — see scripts/generate_alert_report.py's
      # --baseline-late-adjustments.
      - name: Capture baseline late-adjustment count
        id: baseline
        run: |
          uv run python scripts/generate_alert_report.py --json > baseline_alert.json
          count=$(jq '.late_adjustments | length' baseline_alert.json)
          echo "Baseline late_adjustments count: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Inject failure — ${{ inputs.scenario }}
        run: uv run python scripts/inject_failure.py "${{ inputs.scenario }}"

      - name: Check source schema (expected to detect drift for drop-column / change-column-type)
        id: check_schema
        continue-on-error: true
        run: uv run python scripts/check_source_schema.py

      - name: dbt build (expected to fail for most scenarios)
        id: dbt_build
        working-directory: dbt
        continue-on-error: true
        run: uv run dbt build --profiles-dir . --target ci

      - name: dbt source freshness (expected to fail for source-stale)
        id: dbt_freshness
        working-directory: dbt
        continue-on-error: true
        run: uv run dbt source freshness --profiles-dir . --target ci

      # continue-on-error: this script exits 1 by design whenever it finds a
      # failure (see its own docstring) — which is the CORRECT, expected
      # outcome for most scenarios here. Without this, every successfully
      # detected failure would mark the whole job red before the actual
      # verification step below gets to run. --assert-scenario's own exit
      # code, in that next step, is what actually decides the job's result.
      - name: Generate alert report
        id: alert
        if: always()
        continue-on-error: true
        run: uv run python scripts/generate_alert_report.py --output alert.json

      - name: Verify the expected control actually fired
        if: always()
        run: |
          set -e
          scenario="${{ inputs.scenario }}"
          schema_outcome="${{ steps.check_schema.outcome }}"
          freshness_outcome="${{ steps.dbt_freshness.outcome }}"
          echo "check_source_schema outcome: $schema_outcome"
          echo "dbt source freshness outcome: $freshness_outcome"

          case "$scenario" in
            source-stale)
              status=$(jq -r '.results[] | select(.unique_id=="source.meridian_analytics.raw.customers") | .status' dbt/target/sources.json)
              echo "raw.customers freshness status: $status"
              if [ "$status" != "error" ]; then
                echo "Expected source.meridian_analytics.raw.customers to report 'error' freshness, got '$status'."
                exit 1
              fi
              ;;
            drop-column|change-column-type)
              if [ "$schema_outcome" != "failure" ]; then
                echo "Expected scripts/check_source_schema.py to detect drift for '$scenario', but it reported no drift."
                exit 1
              fi
              uv run python scripts/generate_alert_report.py --assert-scenario "$scenario"
              ;;
            late-arriving-refund)
              # Also requires the late_adjustments count to have actually
              # grown past the pre-injection baseline, not just "the build
              # stayed green" — see check_scenario()'s own docstring for why
              # that alone isn't a strong enough check.
              uv run python scripts/generate_alert_report.py --assert-scenario "$scenario" \
                --baseline-late-adjustments "${{ steps.baseline.outputs.count }}"
              ;;
            *)
              # Node-specific assertion, not just "did the build fail" — an
              # unrelated failure would otherwise satisfy this check too.
              # See scripts/generate_alert_report.py's SCENARIO_EXPECTATIONS.
              uv run python scripts/generate_alert_report.py --assert-scenario "$scenario"
              ;;
          esac
          echo "Confirmed: the expected control fired for '$scenario'."

      - name: Recover — restore raw table structure for schema-shaped scenarios
        if: always()
        run: |
          scenario="${{ inputs.scenario }}"
          case "$scenario" in
            drop-column|change-column-type)
              # Regenerate-and-reingest alone can't recover from these — see
              # scripts/recover_raw_table.py's own docstring for why.
              uv run python scripts/recover_raw_table.py raw.orders
              ;;
          esac

      - name: Recover — regenerate clean data and rebuild
        if: always()
        run: |
          uv run python scripts/generate_synthetic_data.py
          uv run python scripts/generate_billing_data.py
          uv run python scripts/generate_event_data.py
          uv run python scripts/ingest.py
          uv run python scripts/ingest_billing.py
          uv run python scripts/ingest_events.py

      - name: Verify recovery (dbt build must be clean again)
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir . --target ci

      - name: Verify recovery (source schema drift must be gone)
        if: always()
        run: uv run python scripts/check_source_schema.py
