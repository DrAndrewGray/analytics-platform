name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: meridian
  POSTGRES_USER: meridian
  POSTGRES_PASSWORD: meridian

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint Python (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright scripts tests

      - name: Lint SQL (sqlfluff)
        run: uv run sqlfluff lint dbt/models dbt/tests

      - name: Generate synthetic data (retail)
        run: uv run python scripts/generate_synthetic_data.py

      - name: Generate synthetic data (billing)
        run: uv run python scripts/generate_billing_data.py

      - name: Generate synthetic data (events)
        run: uv run python scripts/generate_event_data.py

      - name: Ingest into raw schema
        run: uv run python scripts/ingest.py

      - name: Ingest into raw_billing schema
        run: uv run python scripts/ingest_billing.py

      - name: Ingest into raw_events schema
        run: uv run python scripts/ingest_events.py

      - name: Check source schema against the checked-in snapshot
        run: uv run python scripts/check_source_schema.py

      - name: Run pytest
        run: uv run pytest

      - name: Install dbt packages
        working-directory: dbt
        run: uv run dbt deps --profiles-dir .

      - name: dbt build (run + test + snapshot)
        working-directory: dbt
        run: uv run dbt build --profiles-dir . --target ci

      - name: dbt source freshness
        working-directory: dbt
        run: uv run dbt source freshness --profiles-dir . --target ci

      # dbt build above already leaves target/manifest.json (and the
      # semantic manifest mf reads) resolved against the `ci` target's
      # schemas -- confirmed empirically that `mf query` follows whichever
      # target the manifest was last built/parsed against, not a
      # `--target`/`DBT_TARGET` override at query time (neither exists /
      # neither works). Re-parsing here would be redundant; noted so a
      # future edit doesn't "fix" this into two profiles pointing at two
      # different schemas.
      - name: Validate the semantic layer (mf validate-configs)
        working-directory: dbt
        run: uv run mf validate-configs

      - name: Verify governed metrics reconcile with their source marts
        run: uv run python scripts/verify_semantic_layer.py

      - name: Generate the two BI outputs (smoke test)
        run: |
          uv run python scripts/generate_executive_scorecard.py
          uv run python scripts/generate_operational_dashboard.py
