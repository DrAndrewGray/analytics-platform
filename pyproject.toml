[project]
name = "meridian-analytics-platform"
version = "0.1.0"
description = "Synthetic-data analytics engineering portfolio project: ingestion, dbt warehouse, and governed metrics for a fictional retailer."
requires-python = ">=3.11"
dependencies = [
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "dbt-postgres>=1.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pyright>=1.1.400",
    "sqlfluff>=3.0.0",
    "pytest>=8.0.0",
    "dbt-metricflow>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded SVG/CSS template strings, not Python control flow -- wrapping a
# single <rect .../> or CSS custom-property line to satisfy an 80/100-col
# rule fragments markup for no readability gain, unlike every other file
# in this project where the line-length rule is doing real work.
"scripts/bi_common.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
