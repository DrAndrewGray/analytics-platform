[project]
name = "meridian-analytics-platform"
version = "0.1.0"
description = "Synthetic-data analytics engineering portfolio project: ingestion, dbt warehouse, and governed metrics for a fictional retailer."
requires-python = ">=3.11"
dependencies = [
    "faker>=25.0.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "dbt-postgres>=1.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pyright>=1.1.400",
    "sqlfluff>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
